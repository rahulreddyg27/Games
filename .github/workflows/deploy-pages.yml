name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Wait for compatible API deployment
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent https://card-game-api.purplecoast-1e73a5fa.westus2.azurecontainerapps.io/health | grep --extended-regexp --quiet '"apiVersion"[[:space:]]*:[[:space:]]*2'; then
              echo "Compatible API is ready."
              exit 0
            fi
            echo "Waiting for API deployment ($attempt/60)..."
            sleep 10
          done
          echo "The API did not reach the required version; frontend deployment stopped to prevent an incompatible release."
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
